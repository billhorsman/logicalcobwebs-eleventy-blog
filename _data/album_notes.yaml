# A few words about an album, keyed by slug. Albums without an entry
# simply show no note. Plain text (a little inline HTML is fine).
#
# some-album-1999: >
#   Multi-line notes work like this.

little-girl-blue-1958: >
  I could listen to this again and again, especially with headphones
  on. Her voice is so distinctive but it's the piano that gets me. I
  could have chosen many albums from Nina Simone but this was the one
  I listened to first and my favourite.
the-beatles-1968: >
  I borrowed this first off my sister and it sounded so different to
  what I expected The Beatles to sound like. A few standout tracks are:
  Dear Prudence, While My Guitar Gently Weeps, Happiness is a Warm Gun,
  Blackbird, Rocky Racoon, Birthday, Helter Skelter ("I've got blisters
  on my fingers!"). Is that too many?
the-dark-side-of-the-moon-1973: >
  I first listened to this on borrowed vinyl in the early 80s. Favourite
  track is probably The Great Gig in the Sky. Those vocals from Clare Torry!
  I'm also partial to Dub Side of the Moon by the Easy Star All Stars that I
  heard for the first time in a café — I gradually became aware that I wasn't
  listening to the original.
doolittle-1989: >
  This was my introduction to The Pixies, courtesy of John Peel (Monkey Gone
  to Heaven I think). Taped off the radio and eventually bought on CD. Many
  other Pixies albums worthy of inclusion.
4track-demos-1993: >
  Another John Peel introduction (Festive Fifty I think?). I love the lack
  of production and the rawness. The coughing on the start of Legs, and that
  opening, strained, extended "Oh, you're divine". Beautiful.
